<!doctype html><html><head><meta charset="utf-8"><title>PROJECT: RECOVERY Simulator</title><style>html,body{margin:0;background:#050805;color:#65ff8a;font-family:monospace;height:100%}body{display:flex;align-items:center;justify-content:center}#wrap{width:1000px;display:flex;gap:22px;align-items:flex-start}#screen{width:480px;height:320px;background:#081008;border:8px solid #263326;box-shadow:0 0 30px #0a3}canvas{width:480px;height:320px;image-rendering:auto}#panel{width:330px;border:1px solid #244d2e;padding:18px;background:#071007}button{background:#0a180d;color:#65ff8a;border:1px solid #65ff8a;padding:9px 12px;margin:4px;cursor:pointer}h1{font-size:22px;margin:0 0 10px}.small{font-size:12px;line-height:1.5;opacity:.9}kbd{border:1px solid #65ff8a;padding:2px 5px}#status{margin-top:12px;min-height:70px}</style></head><body><div id="wrap"><div id="screen"><canvas id="c" width="480" height="320"></canvas></div><div id="panel"><h1>PROJECT: RECOVERY</h1><div class="small">Desktop simulator: 3 fixed intro puzzles → HACK SUCCESS → main archive → bonus every 3 levels.</div><hr><div><b>Controls</b></div><div class="small"><p><kbd>←</kbd> <kbd>→</kbd> Left knob / X</p><p><kbd>↑</kbd> <kbd>↓</kbd> Right knob / Y</p><p><kbd>Space</kbd> or <kbd>Enter</kbd> Left knob press</p></div><button onclick="press()">LEFT KNOB PRESS</button><button onclick="resetGame()">RESET</button><div id="status" class="small"></div></div></div><script>
const introImgs=['intro/INTRO001.png','intro/INTRO002.png','intro/INTRO003.png'];const archive=Array.from({length:15},(_,i)=>`FILE${String(i+1).padStart(3,'0')}.png`),loaded=new Map();let mode='introPuzzle',intro=0,level=0,cols=3,rows=3,cursor=0,selected=-1,moves=0,start=0,fileNo=0,isBonus=false,board=[],image=null;const ctx=document.getElementById('c').getContext('2d'),FG='#65ff8a',BG='#081008',PX=118,PY=70,IW=240,IH=180;
function load(src){return new Promise(r=>{if(loaded.has(src))return r(loaded.get(src));let im=new Image();im.onload=()=>{loaded.set(src,im);r(im)};im.src=src})}function diff(){if(level<=2){cols=3;rows=3}else if(level<=4){cols=4;rows=3}else if(level<=7){cols=4;rows=4}else{cols=5;rows=4}}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function solved(){return board.every((v,i)=>v===i)}async function startIntro(){cols=3;rows=3;image=await load(introImgs[intro]);cursor=0;selected=-1;moves=0;start=performance.now();board=[...Array(9).keys()];do{sh(board)}while(solved());mode='introPuzzle';draw()}async function startLevel(){level++;diff();isBonus=level%3===0;fileNo=Math.floor(Math.random()*archive.length);image=await load(archive[fileNo]);cursor=0;selected=-1;moves=0;start=performance.now();board=[...Array(cols*rows).keys()];do{sh(board)}while(solved());mode=isBonus?'bonusIntro':'puzzle';draw()}
function text(s,x,y,size=14,align='left'){ctx.fillStyle=FG;ctx.font=size+'px monospace';ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left'}function header(){ctx.fillStyle=FG;ctx.fillRect(38,0,400,38);ctx.fillStyle=BG;ctx.font='20px monospace';ctx.fillText('PROJECT: RECOVERY',46,22);ctx.font='12px monospace';ctx.fillText(mode==='bonusIntro'||isBonus?'BONUS ARCHIVE // PERSONAL':mode==='hackSuccess'?'SECURITY OVERRIDE':'VISUAL DATA RESTORATION',46,34)}
function drawPuzzle(){ctx.fillStyle=BG;ctx.fillRect(0,0,480,320);header();text(mode==='introPuzzle'?`INTRO ${String(intro+1).padStart(3,'0')}`:(isBonus?'BONUS FILE':'FILE'),438,54,13,'right');text(mode==='introPuzzle'?'INITIAL RECOVERY':String(fileNo+1).padStart(3,'0'),438,72,13,'right');text(mode==='introPuzzle'?`SEQUENCE ${intro+1}/3`:`LEVEL ${level}`,438,90,13,'right');text('MOVES '+moves,438,108,13,'right');text(cols+' x '+rows,438,126,13,'right');text(selected<0?'SELECT':'SWAP',438,144,13,'right');const cw=Math.floor(IW/cols),ch=Math.floor(IH/rows);for(let i=0;i<board.length;i++){let c=i%cols,r=Math.floor(i/cols),tile=board[i],sx=tile%cols,sy=Math.floor(tile/cols),x=PX+c*cw,y=PY+r*ch;ctx.save();ctx.beginPath();ctx.rect(x+1,y+1,cw-2,ch-2);ctx.clip();ctx.drawImage(image,x-sx*cw,y-sy*ch);ctx.restore();ctx.strokeStyle=FG;ctx.strokeRect(x,y,cw,ch);if(i===selected)ctx.strokeRect(x+3,y+3,cw-6,ch-6)}let cx=cursor%cols,cy=Math.floor(cursor/cols),x=PX+cx*cw,y=PY+cy*ch;ctx.lineWidth=2;ctx.strokeStyle=FG;ctx.strokeRect(x+1,y+1,cw-2,ch-2);ctx.lineWidth=1;text(mode==='introPuzzle'?'INITIALIZING RECOVERY':'RECOVERY IN PROGRESS',438,310,12,'right')}
function drawRecovered(){ctx.fillStyle=BG;ctx.fillRect(0,0,480,320);header();text(mode==='introRecovered'?'INTRO FILE RECOVERED':(isBonus?'BONUS RECOVERY COMPLETE':'VISUAL DATA RECOVERED'),240,58,17,'center');ctx.drawImage(image,PX,70,IW,IH);text('INTEGRITY 100%',58,300,13);text('MOVES '+moves,200,300,13);text('TIME '+Math.floor((performance.now()-start)/1000)+'s',330,300,13);text('PRESS LEFT KNOB',438,318,13,'right')}
function drawHack(){ctx.fillStyle=BG;ctx.fillRect(0,0,480,320);header();text('!!! SYSTEM OVERRIDE !!!',240,55,16,'center');text('HACK SUCCESS',240,87,22,'center');ctx.strokeStyle=FG;ctx.strokeRect(62,103,356,4);text('ROOT ACCESS: ENABLED',82,124,13);text('FIREWALL: BYPASSED',82,146,13);text('DECRYPTION: COMPLETE',82,168,13);text('CRITICAL DATA UNLOCKED',240,196,16,'center');text('PERSONAL ARCHIVE ACCESS GRANTED',240,220,13,'center');ctx.strokeRect(92,242,296,32);text('PRESS LEFT KNOB TO CONTINUE',240,263,13,'center')}
function drawBonus(){ctx.fillStyle=BG;ctx.fillRect(0,0,480,320);header();text('ADDITIONAL DATA DETECTED',240,70,18,'center');text('PERSONAL ARCHIVE CLEARANCE',240,100,13,'center');text('SECURITY CLEARANCE: ACCEPTED',240,126,13,'center');text('BONUS RECOVERY FILE '+String(fileNo+1).padStart(3,'0'),240,152,13,'center');ctx.strokeStyle=FG;ctx.strokeRect(88,178,304,54);text('PRESS LEFT KNOB TO ACCESS',240,210,13,'center')}
function draw(){if(mode==='introPuzzle'||mode==='puzzle')drawPuzzle();else if(mode==='introRecovered'||mode==='recovered')drawRecovered();else if(mode==='hackSuccess')drawHack();else drawBonus()}
async function press(){if(mode==='introRecovered'){if(intro<2){intro++;await startIntro()}else{mode='hackSuccess';draw()}return}if(mode==='hackSuccess'){level=0;await startLevel();return}if(mode==='bonusIntro'){mode='puzzle';draw();return}if(mode==='recovered'){await startLevel();return}if(selected<0)selected=cursor;else if(selected===cursor)selected=-1;else{[board[selected],board[cursor]]=[board[cursor],board[selected]];moves++;selected=-1;if(solved()){mode=mode==='introPuzzle'?'introRecovered':'recovered'}}draw()}
function moveX(d){if(mode!=='introPuzzle'&&mode!=='puzzle')return;let x=(cursor%cols+d+cols)%cols;cursor=Math.floor(cursor/cols)*cols+x;draw()}function moveY(d){if(mode!=='introPuzzle'&&mode!=='puzzle')return;let y=(Math.floor(cursor/cols)+d+rows)%rows,x=cursor%cols;cursor=y*cols+x;draw()}function resetGame(){mode='introPuzzle';intro=0;level=0;startIntro()}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')moveX(-1);if(e.key==='ArrowRight')moveX(1);if(e.key==='ArrowUp')moveY(-1);if(e.key==='ArrowDown')moveY(1);if(e.key===' '||e.key==='Enter')press()});document.getElementById('status').textContent='15 bonus images. Intro images are fixed and must be recovered in order. Every 3rd level is a bonus.';startIntro();
</script></body></html>
